server {
    listen 80;

    # Captura o subdomínio: matcon.atendimentoweb.com → $subdomain = matcon
    server_name ~^(?<subdomain>[^.]+)\.atendimentoweb\.com$;

    root /lps;
    charset utf-8;

    location = /download {
        try_files /$subdomain.html =404;
        add_header Content-Disposition "attachment; filename=$subdomain.html";
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Served-By "lps-server";
    }

    location = /termos-uso {
        try_files /$subdomain-termos.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Served-By "lps-server";
    }
    location = /politicas-privacidade {
        try_files /$subdomain-privacidade.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Served-By "lps-server";
    }
    location = /leads {
        try_files /$subdomain-leads.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Served-By "lps-server";
    }

    # Tabloide (03/10/2026): <slug>.atendimentoweb.com/tabloide mostra o leitor de
    # tabloide do ONE LINE (/t/<slug> lá). É proxy, não redirect, pra manter o
    # endereço do cliente na barra. A página busca API, imagens e o botão de
    # contato direto em app.matcomsistemas.com (URL absoluta, com CORS liberado
    # nas rotas /api/t/*). Com variável no proxy_pass o nginx não repassa a
    # query sozinho — $is_args$args mantém utm_source, que o contador usa.
    location = /tabloide {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://app.matcomsistemas.com/t/$subdomain$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host app.matcomsistemas.com;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Served-By "lps-server";
    }
    location = /tabloide/ { return 301 /tabloide$is_args$args; }

    location / {
        # Serve /<subdomain>.html (ex: /matcon.html)
        try_files /$subdomain.html =404;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Served-By "lps-server";
        add_header X-LP-Subdomain $subdomain;
    }

    # Evita logs de favicon
    location = /favicon.ico { return 204; access_log off; log_not_found off; }

    error_page 404 /404.html;
    location = /404.html {
        return 404 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>404</title><style>body{font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#000;color:#86868B}</style></head><body><div style="text-align:center"><div style="font-size:48px;margin-bottom:16px">🔗</div><div style="font-size:18px;font-weight:700;color:#F5F5F7;margin-bottom:8px">Página não encontrada</div><div style="font-size:14px">Este subdomínio ainda não possui uma landing page publicada.</div></div></body></html>';
        add_header Content-Type text/html;
    }
}
